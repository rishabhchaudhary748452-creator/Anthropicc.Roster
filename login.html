<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Employee Login - Anthropicc.Roster</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #dff3ff;
    color: #172033;
}

/* Header */
.header {
    background: #063b73;
    color: white;
    text-align: center;
    padding: 32px 15px;
}

.logo {
    display: inline-block;
    background: white;
    color: black;
    padding: 10px 24px;
    border-radius: 12px;
    font-size: 30px;
    font-weight: bold;
}

/* Login container */
.container {
    max-width: 430px;
    margin: 50px auto;
    padding: 20px;
}

.login-box {
    background: white;
    padding: 35px;
    border-radius: 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
}

h2 {
    text-align: center;
    color: #063b73;
    margin-top: 0;
}

.subtitle {
    text-align: center;
    color: #555;
    margin-bottom: 25px;
}

/* Inputs */
label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: bold;
    color: #333;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #bbb;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #063b73;
    box-shadow: 0 0 0 2px rgba(6,59,115,0.12);
}

/* Login button */
.login-btn {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    border: none;
    border-radius: 8px;
    background: #063b73;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.login-btn:hover {
    background: #052f5b;
}

/* Error message */
#error {
    display: none;
    color: #c00000;
    text-align: center;
    font-weight: bold;
    margin-top: 18px;
}

/* Notice */
.notice {
    margin-top: 22px;
    padding: 12px;
    background: #eef8ff;
    border-radius: 8px;
    text-align: center;
    font-size: 12px;
    color: #555;
}

/* Footer */
.footer {
    margin-top: 40px;
    background: #063b73;
    color: white;
    text-align: center;
    padding: 22px;
    font-size: 12px;
    line-height: 1.6;
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">Anthropicc.Roster</div>
</div>

<div class="container">

    <div class="login-box">

        <h2>Monthly Roster</h2>

        <div class="subtitle">
            Employee Login
        </div>

        <label for="employeeId">
            Employee ID
        </label>

        <input
            type="text"
            id="employeeId"
            placeholder="Enter Employee ID"
            autocomplete="off"
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
            autocomplete="new-password"
        >

        <button
            class="login-btn"
            onclick="login()">
            LOGIN
        </button>

        <div id="error">
            Invalid Login Credentials
        </div>

        <div class="notice">
            🔒 Access is restricted to authorized employees only.
        </div>

    </div>

</div>

<div class="footer">
    <strong>Disclaimer</strong><br>
    This portal is intended for authorized users only.
    Unauthorized access or distribution of files is not permitted.
    <br><br>
    © 2026 Anthropicc.Roster
</div>

<script>

function login() {

    const employeeId =
        document.getElementById("employeeId").value.trim();

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("error");

    /* Correct credentials */
    if (
        employeeId === "AP655755" &&
        password === "RISH0908"
    ) {

        window.location.href =
            "dashboard.html?login=Rishabh%20Chaudhary";

    } 
    
    /* Wrong credentials */
    else {

        error.style.display = "block";
    }
}

</script>

</body>
</html>
