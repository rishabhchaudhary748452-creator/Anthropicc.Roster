<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Anthropicc.Roster</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#dff3ff;
}

.header{
    background:#063b73;
    color:white;
    text-align:center;
    padding:30px 15px;
}

.logo{
    display:inline-block;
    background:white;
    color:#000;
    padding:10px 22px;
    border-radius:10px;
    font-size:30px;
    font-weight:bold;
}

.container{
    max-width:420px;
    margin:50px auto;
    padding:20px;
}

.login-box{
    background:white;
    padding:35px;
    border-radius:16px;
    box-shadow:0 6px 20px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    color:#063b73;
    margin-top:0;
}

label{
    display:block;
    margin-top:18px;
    font-weight:bold;
    color:#333;
}

input{
    width:100%;
    padding:13px;
    margin-top:7px;
    border:1px solid #bbb;
    border-radius:8px;
    font-size:16px;
}

.login-btn{
    width:100%;
    padding:14px;
    margin-top:25px;
    border:0;
    border-radius:8px;
    background:#063b73;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:hover{
    background:#052f5b;
}

#error{
    color:#d00000;
    text-align:center;
    margin-top:15px;
}

.note{
    text-align:center;
    font-size:12px;
    color:#666;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">Anthropicc.Roster</div>
</div>

<div class="container">

    <div class="login-box">

        <h2>Monthly Roster</h2>

        <p style="text-align:center;">
            Authorized Login Required
        </p>

        <label>Employee ID</label>

        <input
            type="text"
            id="username"
            value="AP655755"
            placeholder="Enter Employee ID"
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            value="RISH0908"
            placeholder="Enter Password"
        >

        <button class="login-btn" onclick="login()">
            LOGIN
        </button>

        <p id="error"></p>

        <div class="note">
            Access is restricted to authorized users.
        </div>

    </div>

</div>

<script>

function login(){

    const employeeId =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    if(employeeId === "AP655755" && password === "RISH0908"){

        window.location.href =
        "dashboard.html?login=Rishabh%20Chaudhary";

    }else{

        document.getElementById("error").innerText =
        "Invalid Employee ID or Password";

    }
}

</script>

</body>
</html
